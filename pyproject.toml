[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostos-ai"
version = "1.2.1"
authors = [
  { name = "KIB.best", email = "GhostOS@kib.best" },
]
description = "The Invisible, Featherweight, Offline Desktop AI Companion & Copilot"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Desktop Environment",
]
dependencies = [
    "rich>=13.0.0",
    "pywebview>=5.0.0",
    "psutil>=5.9.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
ghost = "ghost.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/GhostOS-ai/GhostOS"
"Bug Tracker" = "https://github.com/GhostOS-ai/GhostOS/issues"
